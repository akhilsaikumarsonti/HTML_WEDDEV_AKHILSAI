<!DOCTYPE html>
<html>
    <head>
        <title> list </title>
    </head>
    <body>
        <h3> unordered </h3>
        <ul>
            <li> coffee </li>
            <li> tea </li>
            <li> milk </li>
        </ul>
        <h3> ordered html list </h3>
        <ol>
            <li> coffee </li>
            <li> tea </li>
            <li> milk </li>
        </ol>
        <h3> descrition list </h3>
        <dl>
            <dt> coffee </dt>
            <dd> -black drink </dd>
            <dt> tea </dt>
            <dd>-brown hot drink </dd>
            <dt> milk </dt>
            <dd> -white cold drink </dd>
        </dl>
    </body>
</html>
